<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flowly</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div class="form-panel">
    <div class="top-bar">
        <a href="signup1.html" class="back-link">← Back</a>
        <span class="step-label">Step 3 of 4</span>
    </div>

    <div class="progress-bar">
        <div class="step-item completed">✓</div>
        <div class="step-item active">2</div>
        <div class="step-item ">3</div>
        <div class="step-item">4</div>
    </div>
    <div class="form-content">
    <h1 class="form-title">Tell us about yourself</h1>
    <p>Help us personalize your experience.</p>

    <form>
        <div class="form-group">
            <label for="fullname">Full name</label>
            <input type="text" id="fullname" placeholder="John Doe">
        </div>

        <div class="form-group">
            <label for="dob">Date of birth</label>
            <input type="date" id="dob">
        </div>

        <div class="form-group">
            <label for="country">Country</label>
            <select id="country">
                <option value="">Select your country</option>
                <option value="ir">Iran</option>
                <option value="us">United States</option>
                <option value="de">Germany</option> 
            </select>
        </div>

        <div class="form-group">
            <label for="phone">Phone number (optional)</label>
            <input type="tel" id="phone" placeholder="+98 912 345 6789">
        </div>

        <a href="verify3.html" class="btn-continue" type="submit">Continue</a>
    </form>
</div>
    
</div>
</body>
</html>
