<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowly</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div class="form-panel">
    <div class="progress-bar">
        <div class="step-item active">1</div>
        <div class="step-item">2</div>
        <div class="step-item">3</div>
        <div class="step-item">4</div>
    </div>

    <div class="form-content">
        <h1 class="form-title">Create your account</h1>
        <p>Let's get started! Enter your email and choose a secure password.</p> 

        <form>
            <div class="form-group">
            <label for="email">Email address</label>
            <input type="email" id="email" placeholder="you@example.com">
            </div>

            <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Create a password">
            </div>

            <div class="form-group">
            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" placeholder="Confirm your password">
            </div>

         <a href="profile-setup2.html" class="btn-continue" type="submit">Continue →</a>
        </form>

        <div class="divider">Or sign up with</div>

        <div class="social-buttons">
           <button class="social-btn">Google</button>
           <button class="social-btn">Apple</button>
        </div>
    </div>
</div>
</body>
</html>
