<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flowly</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div class="form-panel">
    <div class="top-bar">
        <a href="verify3.html" class="back-link">← Back</a>
        <span class="step-label">Step 4 of 4</span>
    </div>

    <div class="progress-bar">
       <div class="step-item completed">✓</div>
        <div class="step-item completed">✓</div>
        <div class="step-item completed">✓</div>
        <div class="step-item active">4</div>
    </div>

    <div class="form-content">
        <h1 class="form-title">Your preferences</h1>
        <p>Help us tailor the best experience for you.</p>

        <form>
        <div class="form-group">
    <label>What are you interested in? (Select up to 3)</label>
    <div class="interest-grid">
        <label class="interest-card">
            <input type="checkbox" name="interest">
            <span>💻 Web Development</span>
        </label>
        <label class="interest-card">
            <input type="checkbox" name="interest">
            <span>🎨 Design</span>
        </label>
        <label class="interest-card">
            <input type="checkbox" name="interest">
            <span>📢 Marketing</span>
        </label>
        <label class="interest-card">
            <input type="checkbox" name="interest">
            <span>💼 Business</span>
        </label>
        <label class="interest-card">
            <input type="checkbox" name="interest">
            <span>✍️ Writing</span>
        </label>
        <label class="interest-card">
            <input type="checkbox" name="interest">
            <span>⋯ Other</span>
        </label>
    </div>
</div>

        <div class="form-group">
    <label>Experience level</label>
    <div class="level-options">
        <label class="level-card">
            <input type="radio" name="level">
            <span>Beginner</span>
        </label>
        <label class="level-card">
            <input type="radio" name="level">
            <span>Intermediate</span>
        </label>
        <label class="level-card">
            <input type="radio" name="level">
            <span>Advanced</span>
        </label>
    </div>
</div>

        <div class="terms-group">
    <label class="terms-label">
        <input type="checkbox" id="terms">
        <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></span>
    </label>
</div>
            <a href="success5.html" class="btn-continue disabled-link" type="submit">Create account</a>
        </form>
    </div>
</div>

<script>
    const termsCheckbox = document.getElementById('terms');
const continueBtn = document.querySelector('.btn-continue');
termsCheckbox.addEventListener('change', () => {
    if (termsCheckbox.checked) {
        continueBtn.classList.remove('disabled-link');
    } else {
        continueBtn.classList.add('disabled-link');
    }
});

</script>
</body>
</html>
