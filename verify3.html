<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowly</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div class="form-panel">
    <div class="top-bar">
        <a href="profile-setup2.html" class="back-link">← Back</a>
        <span class="step-label">Step 2 of 4</span>
    </div>

    <div class="progress-bar">
        <div class="step-item completed">✓</div>
        <div class="step-item completed">✓</div>
        <div class="step-item active">3</div>
        <div class="step-item">4</div>
    </div>

    <div class="form-content">
        <h1 class="form-title">Verify your email</h1>
        <p>We've sent a 6-digit code to your email address. Please enter it below.</p>

        <div class="code-inputs">
            <input type="text" maxlength="1" class="code-box">
            <input type="text" maxlength="1" class="code-box">
            <input type="text" maxlength="1" class="code-box">
            <input type="text" maxlength="1" class="code-box">
            <input type="text" maxlength="1" class="code-box">
            <input type="text" maxlength="1" class="code-box">
        </div>

        <p class="resend-text">Resend code in 00:45</p>

        <a href="preferenes4.html" class="btn-continue">Continue</a>
    </div>

    <p class="help-text">Didn't receive the code? Check your spam folder or try again.</p>
</div>

<script>
    const codeBoxes = document.querySelectorAll('.code-box');

    codeBoxes.forEach((box, index) => {
    box.addEventListener('input', () => {
        if (box.value.length === 1 && index < codeBoxes.length - 1) {
            codeBoxes[index + 1].focus();
        }
    });
});
</script>
</body>
</html>
